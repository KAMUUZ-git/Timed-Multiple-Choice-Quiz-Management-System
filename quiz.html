<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz | LPU Online Assessment Portal</title>

  <!-- Shared stylesheet made by Module 1 (Lakshya). Do not duplicate styles here. -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="quiz-page">

  <!-- ============================================================
       TOP BAR: topic name, student details, progress counter, timer
       ============================================================ -->
  <header class="quiz-topbar">

    <div class="quiz-topbar-info">
      <h1 class="quiz-heading">LPU Online Assessment Portal</h1>
      <p class="quiz-subtitle">
        Topic: <strong id="topicName">--</strong>
        &nbsp;|&nbsp;
        Student: <strong id="studentName">--</strong>
        (<span id="studentReg">--</span>)
      </p>
    </div>

    <div class="quiz-topbar-status">
      <!-- Live countdown timer, e.g. 10:00 -->
      <span class="timer-badge" id="timerBadge">10:00</span>

      <!-- Question progress counter, e.g. "Question 1 of 10" -->
      <span class="progress-badge" id="progressCounter">Question 1 of 10</span>
    </div>

  </header>

  <!-- ============================================================
       MAIN LAYOUT: question area on the left, palette on the right
       ============================================================ -->
  <main class="quiz-layout">

    <!-- ---------------- Question area ---------------- -->
    <section class="card quiz-main">

      <p class="quiz-question-number" id="questionNumber">Q1.</p>
      <h2 class="quiz-question-text" id="questionText">Loading question...</h2>

      <!-- The 4 options are created dynamically by quiz.js -->
      <div class="options-list" id="optionsList"></div>

      <!-- Control buttons under the question -->
      <div class="quiz-actions">
        <button class="btn btn-secondary" id="prevBtn" type="button">Previous</button>
        <button class="btn btn-secondary" id="nextBtn" type="button">Next</button>
        <button class="btn btn-accent" id="markBtn" type="button">Mark for Review</button>
        <button class="btn btn-secondary" id="clearBtn" type="button">Clear Response</button>
      </div>

    </section>

    <!-- ---------------- Question navigation palette ---------------- -->
    <aside class="card quiz-sidebar">

      <h3 class="quiz-sidebar-title">Question Palette</h3>

      <!-- Numbered buttons 1..10 are created dynamically by quiz.js -->
      <div class="palette-grid" id="paletteGrid"></div>

      <!-- Colour legend so the student knows what each colour means -->
      <ul class="palette-legend">
        <li><span class="legend-box answered"></span> Answered</li>
        <li><span class="legend-box marked"></span> Marked for Review</li>
        <li><span class="legend-box unvisited"></span> Not Answered</li>
      </ul>

      <button class="btn btn-primary btn-block" id="submitBtn" type="button">
        Submit Quiz
      </button>

    </aside>

  </main>

  <!-- All quiz logic lives here (Module 2: Kamlesh) -->
  <script src="quiz.js"></script>
</body>
</html>
